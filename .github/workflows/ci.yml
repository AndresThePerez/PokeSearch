name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the Go release from go.mod: its toolchain line is the release
          # CI builds with and the vulnerability scan reads, and the image is
          # built on the same one. The go line is only the oldest Go that may
          # build the module, so a workstation a patch release behind still works.
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The acceptance suite is build-tagged, so vet it explicitly — otherwise
      # it can stop compiling without anything noticing until a manual run.
      - run: go vet -tags acceptance ./internal/...
      # The relevance harness is build-tagged too, and the vet is cluster-free,
      # so the same reasoning applies: vet it or it can stop compiling unseen.
      - run: go vet -tags relevance ./internal/relevance
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      # Pinned so the scanner itself cannot change under CI. A newly published
      # advisory will still turn master red — the vulnerability database is
      # fetched from vuln.go.dev at run time — so bump this deliberately:
      # go run golang.org/x/vuln/cmd/govulncheck@vX.Y.Z ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scripts are ES modules with no package.json, which needs Node
      # 20.19 or 22.7 and later; the suites were verified on 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check every shipped JS file
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(web/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no JS files found under web/ — the glob is wrong, not the code"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
      # Node expands the pattern itself and, when nothing matches, runs no
      # test and exits 0. This step fails first, so deleting or renaming every
      # test file turns the job red instead of leaving it green.
      - name: Fail if there are no frontend test files
        shell: bash
        run: |
          files=(web/js/*.test.mjs)
          if [ ! -e "${files[0]}" ]; then
            echo "no web/js/*.test.mjs files found: the glob is wrong, not the code"
            exit 1
          fi
      - name: Run the frontend tests
        shell: bash
        run: node --test web/js/*.test.mjs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image with build identity stamped in
        shell: bash
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --build-arg COMMIT="${GITHUB_SHA:0:7}" \
            --build-arg BUILT="$(date -u +%FT%TZ)" \
            -t pokesearch:ci .
      - name: The runtime image must not run as root
        shell: bash
        run: |
          user="$(docker inspect --format '{{.Config.User}}' pokesearch:ci)"
          echo "image user: ${user:-<root>}"
          [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ]
