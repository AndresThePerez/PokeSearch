# Server topology: restart policy + memory caps. Port comes from .env
# (APP_PORT=8083). ES stays internal — this file must never map 9200.
# Usage: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# demo-net is created once on the server: docker network create demo-net
# The alias MUST be unique — both Pokesearch and Courier name their service
# "app", and duplicate names on a shared network round-robin (Courier gotcha).
services:
  es:
    restart: unless-stopped
    mem_limit: 1g
  app:
    restart: unless-stopped
    mem_limit: 256m
    networks:
      internal: {}
      demo-net:
        aliases: [pokesearch]

networks:
  demo-net:
    external: true
