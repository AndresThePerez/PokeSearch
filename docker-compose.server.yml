# Server topology: restart policy + memory caps. Port comes from .env
# (APP_PORT). ES stays internal — this file must never map 9200.
# Usage: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# demo-net is created once on the server: docker network create demo-net
# The alias MUST be unique — both PokéSearch and Courier name their service
# "app", and duplicate names on a shared network round-robin (Courier gotcha).
services:
  es:
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    # 2g, four times the 512m JVM heap: the difference is page cache for the
    # Lucene files. At 1g the cache sat at the cap and tail latency spiked.
    mem_limit: 2g
  app:
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    # 256m is the hard limit: past it the kernel kills the process. GOMEMLIMIT
    # is the Go runtime's soft target below it, about 70%, so the collector
    # works harder before memory nears the kill and the rest is left for what
    # the runtime does not count (thread stacks, socket buffers). It is a
    # second belt behind the cap on requests in flight, not a guarantee.
    mem_limit: 256m
    environment:
      - GOMEMLIMIT=180MiB
    networks:
      internal: {}
      demo-net:
        aliases: [pokesearch]

networks:
  demo-net:
    external: true
